<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · HelpDesk</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="auth-box">
      <h1>🎫 HelpDesk</h1>
      <div id="alertaLogin"></div>

      <form id="formLogin">
        <label for="email">E-mail</label>
        <input type="email" id="email" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" required>

        <button type="submit" class="btn" style="width:100%">Entrar</button>
      </form>

      <p><a href="#" id="linkAlternar">Não tem conta? Cadastre-se</a></p>

      <form id="formCadastro" style="display:none">
        <label for="cadNome">Nome completo</label>
        <input type="text" id="cadNome" required>

        <label for="cadEmail">E-mail</label>
        <input type="email" id="cadEmail" required>

        <label for="cadSenha">Senha</label>
        <input type="password" id="cadSenha" minlength="6" required>

        <label for="cadTipo">Tipo de conta</label>
        <select id="cadTipo">
          <option value="cliente">Cliente</option>
          <option value="tecnico">Técnico</option>
        </select>

        <button type="submit" class="btn" style="width:100%">Criar conta</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
