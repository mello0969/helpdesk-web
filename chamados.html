<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chamados · HelpDesk</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <span class="brand">🎫 HelpDesk</span>
    <div>
      <span class="user-pill" id="usuarioPill"></span>
      <button class="link-button" id="btnSair" style="margin-left:12px">Sair</button>
    </div>
  </nav>

  <div class="container">
    <div id="alertaGeral"></div>

    <div class="toolbar">
      <div class="filtros">
        <button data-status="" class="ativo">Todos</button>
        <button data-status="Aberto">Aberto</button>
        <button data-status="Em Atendimento">Em Atendimento</button>
        <button data-status="Concluído">Concluído</button>
      </div>
      <button class="btn" id="btnNovoChamado">+ Novo Chamado</button>
    </div>

    <div id="listaChamados"></div>
  </div>

  <!-- Modal: novo chamado -->
  <div class="modal-overlay" id="modalNovo">
    <div class="modal">
      <button class="close-x" data-fechar="modalNovo">✕</button>
      <h2>Novo Chamado</h2>
      <form id="formNovoChamado">
        <label for="novoTitulo">Título</label>
        <input type="text" id="novoTitulo" required>

        <label for="novaDescricao">Descrição</label>
        <textarea id="novaDescricao" required></textarea>

        <label for="novaPrioridade">Prioridade</label>
        <select id="novaPrioridade">
          <option value="Baixa">Baixa</option>
          <option value="Média" selected>Média</option>
          <option value="Alta">Alta</option>
        </select>

        <button type="submit" class="btn" style="width:100%">Abrir Chamado</button>
      </form>
    </div>
  </div>

  <!-- Modal: detalhe do chamado -->
  <div class="modal-overlay" id="modalDetalhe">
    <div class="modal">
      <button class="close-x" data-fechar="modalDetalhe">✕</button>
      <div id="detalheConteudo"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/chamados.js"></script>
</body>
</html>
